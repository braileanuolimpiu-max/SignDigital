<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            color: #374151;
        }
        .card {
            background: #fff;
            padding: 28px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 380px;
            max-width: calc(100% - 40px);
            box-sizing: border-box;
        }
        h2 {
            margin: 0 0 20px;
            font-size: 18px;
            color: #111827;
            text-align: center;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        input {
            font: inherit;
            font-size: 13px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        .help {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
        .help ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }
        .errorlist {
            list-style: none;
            margin: 0 0 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            background: #fef2f2;
            color: #b91c1c;
        }
        button {
            width: 100%;
            font: inherit;
            font-size: 13px;
            padding: 9px 12px;
            margin-top: 6px;
            border: 1px solid #2563eb;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .other {
            margin: 18px 0 0;
            font-size: 13px;
            text-align: center;
        }
        .other a {
            color: #2563eb;
        }
        @media (max-width: 600px) {
            .card {
                max-width: calc(100% - 24px);
                padding: 28px 22px;
            }
            h2 {
                font-size: 22px;
            }
            label {
                font-size: 13px;
            }
            input {
                font-size: 16px;
                padding: 13px;
            }
            button {
                font-size: 17px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ title }}</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field.errors }}
                {{ field }}
                {% if field.help_text %}
                <div class="help">{{ field.help_text|safe }}</div>
                {% endif %}
            </div>
            {% endfor %}

            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">{{ button }}</button>
        </form>

        <p class="other">{{ other_text }} <a href="{% url other_link %}">{{ other_link_text }}</a></p>
    </div>
</body>
</html>
