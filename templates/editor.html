<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spațiu de Semnare</title>
    <script src="https://cdn.jsdelivr.net/npm/fabric@7.4.0/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
        }
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
            background: white;
            padding: 12px 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .toolbar-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toolbar-group + .toolbar-group {
            padding-left: 20px;
            border-left: 1px solid #e5e7eb;
        }
        .group-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .group-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-panel button {
            font: inherit;
            font-size: 13px;
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }
        .info-panel button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .info-panel button:active {
            background: #e5e7eb;
        }
        .info-panel button:disabled,
        .info-panel button.primary:disabled,
        .info-panel button.primary:disabled:hover,
        .info-panel button:disabled:hover {
            background: #e5e7eb;
            border-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .info-panel button.toggled {
            background: #dbeafe;
            border-color: #2563eb;
            color: #1d4ed8;
        }
        .info-panel button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .info-panel button.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        .info-panel select {
            font: inherit;
            font-size: 13px;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #374151;
            cursor: pointer;
        }
        .info-panel a {
            font-size: 13px;
            color: #2563eb;
            text-decoration: none;
        }
        .info-panel a:hover {
            text-decoration: underline;
        }
        .spacer {
            margin-left: auto;
        }
        .canvas-wrapper {
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            background: #F5F5F5;
            padding: 24px 0;
            box-sizing: border-box;
        }
        .page {
            width: fit-content;
            margin: 0 auto 24px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
            outline: 2px solid transparent;
            transition: outline-color 0.12s;
        }
        .page.active {
            outline-color: #93c5fd;
        }
        canvas {
            display: block;
        }
        .input-color {
            display: inline-flex;
        }
        input[type="color"] {
          -webkit-appearance: none;
          appearance: none;
          width: 34px;
          height: 32px;
          padding: 0;
          border: 1px solid #d1d5db;
          border-radius: 6px;
          cursor: pointer;
          background: none;
      }
      input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
      input[type="color"]::-moz-color-swatch     { border: none; border-radius: 4px; }
        @media (max-width: 600px) {
            .info-panel {
                gap: 14px;
                padding: 10px 12px;
            }
            .toolbar-group + .toolbar-group {
                padding-left: 0;
                border-left: none;
            }
            .group-controls {
                flex-wrap: wrap;
                gap: 8px;
            }
            .info-panel button,
            .info-panel select {
                font-size: 15px;
                padding: 10px 14px;
            }
            .info-panel a {
                font-size: 15px;
            }
            input[type="color"] {
                width: 44px;
                height: 42px;
            }
        }
        dialog {
            border: none;
            border-radius: 10px;
            padding: 24px;
            width: 340px;
            max-width: calc(100% - 32px);
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #374151;
        }
        dialog::backdrop {
            background: rgba(0,0,0,0.35);
        }
        dialog h3 {
            margin: 0 0 16px;
            font-size: 17px;
            color: #111827;
        }
        dialog label {
            display: block;
            margin-bottom: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        dialog input,
        dialog select {
            display: block;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
            font: inherit;
            font-size: 14px;
            text-transform: none;
            letter-spacing: normal;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #374151;
        }
        dialog input[type="color"] {
            width: 48px;
            height: 38px;
            padding: 2px;
        }
        .dialog-field {
            margin-bottom: 12px;
        }
        .field-name {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .dialog-error {
            min-height: 18px;
            margin: 0 0 12px;
            font-size: 13px;
            color: #b91c1c;
        }
        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .dialog-buttons button {
            font: inherit;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            color: #374151;
            cursor: pointer;
        }
        .dialog-buttons button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .dialog-buttons button:disabled {
            background: #e5e7eb;
            border-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Mr+De+Haviland&family=Luxurious+Script&display=swap" rel="stylesheet"></head>
<body>
    <div class="info-panel">
        <div class="toolbar-group">
            <span class="group-label">Text</span>
            <div class="group-controls">
                <button type="button" onclick="AddText()">Add Text</button>
                <select id="FontMenu">
                    <option value="CourierNew">CourierNew</option>
                    <option value="TimesNewRoman">TimesNewRoman</option>
                    <option value="SansSerif">Sans-serif</option>
                    <option value="Arial">Arial</option>
                    <option value="MonsieurLaDoulaise">Monsieur La Doulaise</option>
                    <option value="MrDeHaviland" selected>Mr De Haviland</option>
                    <option value="LuxuriousScript">Luxurious Script</option>
                </select>
                <div class="input-color">
                    <input type="color" id="TextColor" value="#000000" title="Text color">
                </div>
            </div>
        </div>

        <div class="toolbar-group">
            <span class="group-label">Drawing</span>
            <div class="group-controls">
                <button type="button" id="DrawingButton" onclick="DrawingMode()">Drawing</button>
                <button type="button" onclick="Erase()">Erase page</button>
                <div class="input-color">
                    <input type="color" id="DrawColor" value="#000000" title="Brush color">
                </div>
                <input id="ColorBar" type="range" value="2" min="1" max="20" style="display: none;" oninput="this.nextElementSibling.value = this.value;">
                <output id = "out" style="display: none;">2</output>
            </div>
        </div>
        {% if mode == 'multi' %}
        <div class="toolbar-group">
            <span class="group-label">Signers</span>
            <div class="group-controls">
                <button type="button" onclick="AddPlaceholder()">Add placeholder</button>
                <button type="button" onclick="EditPlaceholder()">Edit placeholder</button>
            </div>
        </div>
        {% endif %}

        <div class="toolbar-group spacer">
            <span class="group-label">Document</span>
            <div class="group-controls">
                <a href="{{ original_url }}" target="_blank">Open original</a>
                {% if mode == 'multi' %}
                <button type="button" class="primary" id="FinishButton" onclick="OpenSendDialog()" disabled>Sign &amp; send</button>
                {% else %}
                <button type="button" class="primary" id="FinishButton" onclick="ExportPDF()" disabled>Export</button>
                {% endif %}
            </div>
        </div>
    </div>

    <dialog id="PlaceholderDialog">
        <h3>Who signs here?</h3>
        <label>Name
            <input type="text" id="PlaceholderName" maxlength="100">
        </label>
        <label>Email
            <input type="email" id="PlaceholderEmail">
        </label>
        <label>Signing font
            <select id="PlaceholderFont">
                <option value="CourierNew">CourierNew</option>
                <option value="TimesNewRoman">TimesNewRoman</option>
                <option value="SansSerif">Sans-serif</option>
                <option value="Arial">Arial</option>
                <option value="MonsieurLaDoulaise">Monsieur La Doulaise</option>
                <option value="MrDeHaviland" selected>Mr De Haviland</option>
                <option value="LuxuriousScript">Luxurious Script</option>
            </select>
        </label>
        <div class="dialog-field">
            <span class="field-name">Color</span>
            <input type="color" id="PlaceholderColor" value="#1e3a8a">
        </div>
        <p class="dialog-error" id="PlaceholderError"></p>
        <div class="dialog-buttons">
            <button type="button" onclick="CancelPlaceholder()">Cancel</button>
            <button type="button" class="primary" onclick="SavePlaceholder()">Save</button>
        </div>
    </dialog>

    <dialog id="SendDialog">
        <h3>Send for signing</h3>
        <label>Your email
            <input type="email" id="SenderEmail">
        </label>
        <p class="dialog-error" id="SendError"></p>
        <div class="dialog-buttons">
            <button type="button" onclick="CloseSendDialog()">Cancel</button>
            <button type="button" class="primary" id="SendButton" onclick="SendForSigning()">Send</button>
        </div>
    </dialog>

    <div class="canvas-wrapper" id="wrapper"></div>

    {{ editor_data|json_script:"editor-data" }}

<script>
    const MAX_PAGE_WIDTH = 800;
    const PAGE_SIDE_GUTTER = 16;
    const POINTS_PER_INCH = 72;
    const HEARTBEAT_INTERVAL_MS = 30 * 1000;

    const FONTS = {
        CourierNew:         { family: 'Courier New',          size: 14, webFont: false },
        TimesNewRoman:      { family: 'Times New Roman',      size: 14, webFont: false },
        SansSerif:          { family: 'sans-serif',           size: 14, webFont: false },
        Arial:              { family: 'Arial',                size: 14, webFont: false },
        MonsieurLaDoulaise: { family: 'Monsieur La Doulaise', size: 25, webFont: true },
        MrDeHaviland:       { family: 'Mr De Haviland',       size: 25, webFont: true },
        LuxuriousScript:    { family: 'Luxurious Script',     size: 25, webFont: true },
    };

    const editorData = JSON.parse(document.getElementById('editor-data').textContent);
    const wrapper = document.getElementById('wrapper');
    const fontMenu = document.getElementById('FontMenu');
    const textColorInput = document.getElementById('TextColor');
    const drawColorInput = document.getElementById('DrawColor');
    const brushSizeInput = document.getElementById('ColorBar');
    const brushSizeLabel = document.getElementById('out');
    const drawingButton = document.getElementById('DrawingButton');
    const finishButton = document.getElementById('FinishButton');
    const csrfToken = '{{ csrf_token }}';

    const pageCanvases = [];
    let canvas = null;
    let drawingMode = false;
    let textCounter = 0;
    let loadedPages = 0;

    const handleStyle = fabric.InteractiveFabricObject.ownDefaults;
    handleStyle.cornerStyle = 'circle';
    handleStyle.cornerSize = 9;
    handleStyle.cornerColor = '#0096FF';
    handleStyle.padding = 8;
    handleStyle.transparentCorners = false;
    handleStyle.borderColor = 'lightblue';
    handleStyle.borderScaleFactor = 2;


    function toPageUnits(pageCanvas, screenPixels) {
        return screenPixels * pageCanvas.pageWidth / MAX_PAGE_WIDTH;
    }

    function pageDisplayWidth() {
        return Math.min(wrapper.clientWidth - 2 * PAGE_SIDE_GUTTER, MAX_PAGE_WIDTH);
    }

    function fitPageCanvas(pageCanvas) {
        const width = pageDisplayWidth();
        const zoom = width / pageCanvas.pageWidth;
        pageCanvas.setDimensions({ width: width, height: pageCanvas.pageHeight * zoom });
        pageCanvas.setZoom(zoom);
    }

    function pageElementOf(pageCanvas) {
        return pageCanvas.wrapperEl.parentElement;
    }

    function setActiveCanvas(pageCanvas) {
        if (canvas === pageCanvas) {
            return;
        }
        if (canvas) {
            canvas.discardActiveObject();
            canvas.requestRenderAll();
            pageElementOf(canvas).classList.remove('active');
        }
        canvas = pageCanvas;
        pageElementOf(canvas).classList.add('active');
    }

    function updateBrush(pageCanvas) {
        pageCanvas.freeDrawingBrush.color = drawColorInput.value;
        pageCanvas.freeDrawingBrush.width = toPageUnits(pageCanvas, Number(brushSizeInput.value));
    }

    function pageImageLoaded(pageCanvas, image) {
        pageCanvas.backgroundImage = image;
        pageCanvas.requestRenderAll();

        loadedPages = loadedPages + 1;
        if (loadedPages === editorData.pages.length) {
            finishButton.disabled = false;
        }
    }

    function createPageCanvas(page) {
        const pageElement = document.createElement('div');
        pageElement.className = 'page';
        const canvasElement = document.createElement('canvas');
        pageElement.appendChild(canvasElement);
        wrapper.appendChild(pageElement);

        const pageCanvas = new fabric.Canvas(canvasElement, { allowTouchScrolling: true });
        pageCanvas.pageWidth = page.width;
        pageCanvas.pageHeight = page.height;
        fitPageCanvas(pageCanvas);

        pageCanvas.freeDrawingBrush = new fabric.PencilBrush(pageCanvas);
        updateBrush(pageCanvas);

        pageCanvas.on('mouse:down', function () {
            setActiveCanvas(pageCanvas);
        });

        pageCanvas.on('mouse:dblclick', function (event) {
            if (event.target && event.target.isPlaceholder) {
                openPlaceholderDialog(event.target);
            }
        });

        fabric.FabricImage.fromURL(page.url, {}, { originX: 'left', originY: 'top' }).then(function (image) {
            pageImageLoaded(pageCanvas, image);
        });

        return pageCanvas;
    }


    function visiblePartOf(pageCanvas) {
        const wrapperBox = wrapper.getBoundingClientRect();
        const pageBox = pageElementOf(pageCanvas).getBoundingClientRect();
        const top = Math.max(pageBox.top, wrapperBox.top);
        const bottom = Math.min(pageBox.bottom, wrapperBox.bottom);
        return {
            top: top,
            bottom: bottom,
            height: Math.max(0, bottom - top),
            pageTop: pageBox.top,
        };
    }

    function mostVisibleCanvas() {
        if (visiblePartOf(canvas).height > 0) {
            return canvas;
        }
        let best = pageCanvases[0];
        for (const pageCanvas of pageCanvases) {
            if (visiblePartOf(pageCanvas).height > visiblePartOf(best).height) {
                best = pageCanvas;
            }
        }
        return best;
    }

    function isText(object) {
        if (!object) {
            return false;
        }
        if (object.isPlaceholder) {
            return false;
        }
        return object.type === 'i-text' || object.type === 'text';
    }

    function selectedText() {
        const object = canvas.getActiveObject();
        if (isText(object)) {
            return object;
        }
        return null;
    }

    function refreshText(text) {
        text.initDimensions();
        text.setCoords();
        if (text.canvas) {
            text.canvas.requestRenderAll();
        }
    }

    function applyFont(text, fontKey) {
        const font = FONTS[fontKey];
        text.set({ fontFamily: font.family, fontSize: toPageUnits(canvas, font.size) });
        refreshText(text);

        if (font.webFont) {
            document.fonts.load('1em "' + font.family + '"').then(function () {
                fabric.cache.clearFontCache(font.family);
                refreshText(text);
            });
        }
    }

    function AddText() {
        setActiveCanvas(mostVisibleCanvas());

        const visible = visiblePartOf(canvas);
        const middleOnScreen = (visible.top + visible.bottom) / 2;
        const middleOnPage = (middleOnScreen - visible.pageTop) / canvas.getZoom();

        textCounter = textCounter + 1;
        const text = new fabric.IText('Semnatura ' + textCounter, {
            originX: 'center',
            originY: 'center',
            left: canvas.pageWidth / 2,
            top: middleOnPage,
            fill: textColorInput.value,
        });
        applyFont(text, fontMenu.value);

        canvas.add(text);
        canvas.setActiveObject(text);
        canvas.requestRenderAll();
    }

    fontMenu.addEventListener('change', function () {
        const text = selectedText();
        if (text) {
            applyFont(text, fontMenu.value);
        }
    });

    textColorInput.addEventListener('input', function () {
        const text = selectedText();
        if (text) {
            text.set('fill', textColorInput.value);
            canvas.requestRenderAll();
        }
    });


    function DrawingMode() {
        drawingMode = !drawingMode;

        for (const pageCanvas of pageCanvases) {
            pageCanvas.discardActiveObject();
            pageCanvas.isDrawingMode = drawingMode;
            pageCanvas.requestRenderAll();
        }

        if (drawingMode) {
            brushSizeInput.style.display = 'inline';
            brushSizeLabel.style.display = 'inline';
            drawingButton.classList.add('toggled');
        } else {
            brushSizeInput.style.display = 'none';
            brushSizeLabel.style.display = 'none';
            drawingButton.classList.remove('toggled');
        }
    }

    function updateAllBrushes() {
        for (const pageCanvas of pageCanvases) {
            updateBrush(pageCanvas);
        }
    }

    drawColorInput.addEventListener('input', updateAllBrushes);
    brushSizeInput.addEventListener('input', updateAllBrushes);

    function Erase() {
        for (const drawing of canvas.getObjects('path')) {
            canvas.remove(drawing);
        }
        canvas.requestRenderAll();
    }


    function ExportPDF() {
        const jsPDF = window.jspdf.jsPDF;
        let pdf = null;

        for (const pageCanvas of pageCanvases) {
            pageCanvas.discardActiveObject();
            pageCanvas.renderAll();

            const width = pageCanvas.pageWidth * POINTS_PER_INCH / editorData.dpi;
            const height = pageCanvas.pageHeight * POINTS_PER_INCH / editorData.dpi;
            let orientation = 'portrait';
            if (width > height) {
                orientation = 'landscape';
            }
            const image = pageCanvas.toDataURL({
                format: 'jpeg',
                quality: 0.92,
                multiplier: 1 / pageCanvas.getZoom(),
            });

            if (pdf === null) {
                pdf = new jsPDF({ unit: 'pt', format: [width, height], orientation: orientation });
            } else {
                pdf.addPage([width, height], orientation);
            }
            pdf.addImage(image, 'JPEG', 0, 0, width, height);
        }

        pdf.save(editorData.filename + '.pdf');
    }


    const placeholderDialog = document.getElementById('PlaceholderDialog');
    const placeholderNameInput = document.getElementById('PlaceholderName');
    const placeholderEmailInput = document.getElementById('PlaceholderEmail');
    const placeholderFontInput = document.getElementById('PlaceholderFont');
    const placeholderColorInput = document.getElementById('PlaceholderColor');
    const placeholderError = document.getElementById('PlaceholderError');
    let editedPlaceholder = null;

    function setPlaceholderFont(placeholder, fontKey) {
        const font = FONTS[fontKey];
        placeholder.fontKey = fontKey;
        placeholder.set('fontFamily', font.family);
        refreshText(placeholder);

        document.fonts.load('1em "' + font.family + '"').then(function () {
            fabric.cache.clearFontCache(font.family);
            refreshText(placeholder);
        });
    }

    function AddPlaceholder() {
        setActiveCanvas(mostVisibleCanvas());

        const visible = visiblePartOf(canvas);
        const middleOnScreen = (visible.top + visible.bottom) / 2;
        const middleOnPage = (middleOnScreen - visible.pageTop) / canvas.getZoom();

        const placeholder = new fabric.FabricText('Signature', {
            originX: 'center',
            originY: 'center',
            left: canvas.pageWidth / 2,
            top: middleOnPage,
            fontSize: toPageUnits(canvas, 28),
            fill: placeholderColorInput.value,
            backgroundColor: 'rgba(253, 230, 138, 0.3)',
            lockRotation: true,
        });
        placeholder.setControlsVisibility({ mt: false, mb: false, ml: false, mr: false, mtr: false });
        placeholder.isPlaceholder = true;
        placeholder.signerName = '';
        placeholder.signerEmail = '';
        setPlaceholderFont(placeholder, placeholderFontInput.value);

        canvas.add(placeholder);
        canvas.setActiveObject(placeholder);
        canvas.requestRenderAll();

        openPlaceholderDialog(placeholder);
    }

    function openPlaceholderDialog(placeholder) {
        editedPlaceholder = placeholder;
        placeholderNameInput.value = placeholder.signerName;
        placeholderEmailInput.value = placeholder.signerEmail;
        placeholderFontInput.value = placeholder.fontKey;
        placeholderColorInput.value = placeholder.fill;
        placeholderError.textContent = '';
        placeholderDialog.showModal();
        placeholderNameInput.focus();
    }

    function EditPlaceholder() {
        const object = canvas.getActiveObject();
        if (object && object.isPlaceholder) {
            openPlaceholderDialog(object);
        }
    }

    function SavePlaceholder() {
        const name = placeholderNameInput.value.trim();
        const email = placeholderEmailInput.value.trim();

        if (name === '') {
            placeholderError.textContent = 'Write the name of the person who signs here.';
            return;
        }
        if (email === '' || !placeholderEmailInput.checkValidity()) {
            placeholderError.textContent = 'Write a valid email address.';
            return;
        }

        editedPlaceholder.signerName = name;
        editedPlaceholder.signerEmail = email;
        editedPlaceholder.set('text', name);
        editedPlaceholder.set('fill', placeholderColorInput.value);
        setPlaceholderFont(editedPlaceholder, placeholderFontInput.value);

        placeholderDialog.close();
    }

    function CancelPlaceholder() {
        if (editedPlaceholder.signerEmail === '') {
            editedPlaceholder.canvas.remove(editedPlaceholder);
        }
        placeholderDialog.close();
    }

    placeholderDialog.addEventListener('cancel', function (event) {
        event.preventDefault();
        CancelPlaceholder();
    });


    const sendDialog = document.getElementById('SendDialog');
    const senderEmailInput = document.getElementById('SenderEmail');
    const sendError = document.getElementById('SendError');
    const sendButton = document.getElementById('SendButton');

    function allPlaceholders() {
        const found = [];
        for (let index = 0; index < pageCanvases.length; index++) {
            for (const object of pageCanvases[index].getObjects()) {
                if (object.isPlaceholder) {
                    found.push({ pageNumber: index + 1, placeholder: object });
                }
            }
        }
        return found;
    }

    function OpenSendDialog() {
        sendError.textContent = '';
        if (allPlaceholders().length === 0) {
            sendError.textContent = 'Add at least one placeholder before sending.';
        }
        sendDialog.showModal();
        senderEmailInput.focus();
    }

    function CloseSendDialog() {
        sendDialog.close();
    }

    function placeholderData() {
        const data = [];
        for (const item of allPlaceholders()) {
            const placeholder = item.placeholder;
            const width = placeholder.getScaledWidth();
            const height = placeholder.getScaledHeight();
            data.push({
                page_number: item.pageNumber,
                left: placeholder.left - width / 2,
                top: placeholder.top - height / 2,
                width: width,
                height: height,
                font_size: placeholder.fontSize * placeholder.scaleY,
                font_key: placeholder.fontKey,
                color: placeholder.fill,
                name: placeholder.signerName,
                email: placeholder.signerEmail,
            });
        }
        return data;
    }

    async function pageImageWithoutPlaceholders(pageCanvas) {
        pageCanvas.discardActiveObject();
        for (const object of pageCanvas.getObjects()) {
            if (object.isPlaceholder) {
                object.visible = false;
            }
        }
        pageCanvas.renderAll();

        const dataUrl = pageCanvas.toDataURL({
            format: 'jpeg',
            quality: 0.92,
            multiplier: 1 / pageCanvas.getZoom(),
        });

        for (const object of pageCanvas.getObjects()) {
            object.visible = true;
        }
        pageCanvas.renderAll();

        const response = await fetch(dataUrl);
        return await response.blob();
    }

    async function SendForSigning() {
        const senderEmail = senderEmailInput.value.trim();
        if (senderEmail === '' || !senderEmailInput.checkValidity()) {
            sendError.textContent = 'Write a valid email for yourself.';
            return;
        }
        if (allPlaceholders().length === 0) {
            sendError.textContent = 'Add at least one placeholder before sending.';
            return;
        }

        sendError.textContent = '';
        sendButton.disabled = true;
        sendButton.textContent = 'Sending…';

        const form = new FormData();
        form.append('sender_email', senderEmail);
        form.append('placeholders', JSON.stringify(placeholderData()));
        for (let index = 0; index < pageCanvases.length; index++) {
            const image = await pageImageWithoutPlaceholders(pageCanvases[index]);
            form.append('page_' + (index + 1), image, 'page.jpg');
        }

        try {
            const response = await fetch('{% url "send_for_signing" %}', {
                method: 'POST',
                body: form,
                headers: { 'X-CSRFToken': csrfToken },
            });
            const result = await response.json();

            if (response.ok) {
                window.location.href = result.redirect;
                return;
            }
            sendError.textContent = result.error;
        } catch (error) {
            sendError.textContent = 'Could not reach the server. Try again.';
        }

        sendButton.disabled = false;
        sendButton.textContent = 'Send';
    }


    window.addEventListener('keydown', function (event) {
        if (event.key !== 'Delete' && event.key !== 'Backspace') {
            return;
        }
        if (event.target.tagName === 'INPUT') {
            return;
        }
        const selected = canvas.getActiveObject();
        if (!selected || selected.isEditing) {
            return;
        }
        for (const object of canvas.getActiveObjects()) {
            canvas.remove(object);
        }
        canvas.discardActiveObject();
        canvas.requestRenderAll();
    });

    let resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            for (const pageCanvas of pageCanvases) {
                fitPageCanvas(pageCanvas);
            }
        }, 150);
    });


    function sendHeartbeat() {
        fetch('{% url "heartbeat" %}', { method: 'POST' }).then(function (response) {
            if (response.status === 410) {
                window.location.href = '{% url "homepage" %}';
            }
        }).catch(function () {});
    }

    setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
            sendHeartbeat();
        }
    });

    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            sendHeartbeat();
        }
    });

    window.addEventListener('pagehide', function () {
        navigator.sendBeacon('{% url "track_leave" %}');
    });


    for (const page of editorData.pages) {
        pageCanvases.push(createPageCanvas(page));
    }
    setActiveCanvas(pageCanvases[0]);
</script>

</body>
</html>
