<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 24px; background: #f4f7f6; font-family: Arial, sans-serif; color: #374151;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 10px; padding: 28px;">
        <h2 style="margin: 0 0 12px; font-size: 18px; color: #111827;">Hello {{ signer.name }},</h2>
        <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.5;">
            {{ document.sender_email }} asks you to sign <strong>{{ document.filename }}</strong>.
            Your name will be placed in {{ placeholder_count }} place{{ placeholder_count|pluralize }}.
        </p>
        <div style="text-align: center;">
            <a href="{{ link }}" style="display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 6px; font-size: 15px;">
                Open and sign
            </a>
        </div>
        <p style="margin: 20px 0 0; font-size: 12px; color: #9ca3af;">
            If the button does not work, open this link: {{ link }}
        </p>
    </div>
</body>
</html>
