<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 24px; background: #f4f7f6; font-family: Arial, sans-serif; color: #374151;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 10px; padding: 28px; text-align: center;">
        <h2 style="margin: 0 0 12px; font-size: 18px; color: #111827;">{{ signer.name }} has signed</h2>
        <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.5;">
            <strong>{{ document.filename }}</strong>
        </p>
        {% if finished %}
        <p style="margin: 0; font-size: 14px; line-height: 1.5;">
            Everyone has signed. The final document is attached.
        </p>
        {% else %}
        <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5;">
            The document signed so far is attached. Still waiting for:
        </p>
        {% for person in waiting %}
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #6b7280;">
            {{ person.name }} ({{ person.email }})
        </p>
        {% endfor %}
        {% endif %}
    </div>
</body>
</html>
