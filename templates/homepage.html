<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign a file</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 28px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 380px;
            max-width: calc(100% - 40px);
        }
        h2 {
            margin: 0 0 4px;
            font-size: 18px;
            color: #111827;
        }
        .subtitle {
            margin: 0 0 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        .messages {
            list-style: none;
            margin: 0 0 18px;
            padding: 0;
        }
        .messages li {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #f3f4f6;
            color: #374151;
            margin-bottom: 6px;
        }
        form p {
            margin: 0 0 14px;
        }
        form label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        form input, form select, form textarea {
            font: inherit;
            font-size: 13px;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #374151;
            width: 100%;
            box-sizing: border-box;
        }
        form input[type="file"] {
            padding: 6px;
            cursor: pointer;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            font: inherit;
            font-size: 13px;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }
        button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        button:active {
            background: #e5e7eb;
        }
        button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        button.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        @media (max-width: 600px) {
            .card {
                width: 100%;
                max-width: calc(100% - 24px);
                padding: 28px 22px;
            }
            h2 {
                font-size: 22px;
            }
            .subtitle {
                font-size: 15px;
            }
            form label {
                font-size: 13px;
            }
            form input, form select, form textarea {
                font-size: 16px;
                padding: 13px;
            }
            .actions {
                flex-direction: column;
                gap: 10px;
            }
            button {
                font-size: 17px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>What type of file u want to sign?</h2>
        <p class="subtitle">Pick a PDF or an image to get started.</p>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit" class="primary" name="save_pdf" value="save_pdf">Upload PDF</button>
                <button type="submit" name="save_img" value="save_img">Upload IMG</button>
            </div>
        </form>
    </div>
</body>
</html>
