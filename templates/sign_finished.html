<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            color: #374151;
        }
        .card {
            background: #ffffff;
            padding: 28px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 380px;
            max-width: calc(100% - 40px);
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #111827;
        }
        p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>
    </div>
</body>
</html>
